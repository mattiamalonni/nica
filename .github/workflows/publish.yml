name: Publish to npm

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        run: npm install -g npm

      - name: Install dependencies
        run: npm ci

      - name: Sync version from root
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm pkg set version="$VERSION" --workspace=packages/nica
          npm pkg set version="$VERSION" --workspace=packages/nica-next

      - name: Build nica
        run: npm run build --workspace=packages/nica
      - name: Build nica-next
        run: npm run build --workspace=packages/nica-next
      - name: Publish nica
        run: npm publish --provenance --access public
        working-directory: packages/nica
      - name: Publish nica-next
        run: npm publish --provenance --access public
        working-directory: packages/nica-next
